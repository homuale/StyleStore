<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body class="d-flex flex-column min-vh-100">
  <header th:replace="~{fragments/layout :: header('productos')}"></header>

  <main class="container my-4 flex-grow-1">
    <div class="mb-4">
      <h1 class="h3 mb-1">Productos</h1>
      <p class="text-body-secondary mb-0">Catálogo por categorías, talla y stock disponible.</p>
    </div>

    <form class="row g-2 mb-4" role="search" th:action="@{/productos}" method="get">
      <div class="col-12 col-md-6">
        <label for="filtroBusqueda" class="visually-hidden">Buscar producto</label>
        <input type="search" class="form-control" id="filtroBusqueda" name="q" th:value="${q}" placeholder="Buscar por nombre...">
      </div>
      <div class="col-8 col-md-4">
        <label for="filtroCategoria" class="visually-hidden">Filtrar por categoría</label>
        <select class="form-select" id="filtroCategoria" name="categoria">
          <option value="">Todas las categorías</option>
          <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                  th:selected="${categoriaSel != null and categoriaSel == c.id}">Categoría</option>
        </select>
      </div>
      <div class="col-4 col-md-2 d-grid">
        <button type="submit" class="btn btn-brand">Filtrar</button>
      </div>
    </form>

    <div class="alert alert-light border" th:if="${#lists.isEmpty(productos)}">
      No se encontraron productos con ese criterio. <a th:href="@{/productos}">Ver todos</a>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
      <div class="col" th:each="p : ${productos}">
        <div class="card h-100 product-card shadow-sm">
          <img th:src="@{/img/{f}(f=${p.imagen})}" class="card-img-top" th:alt="${p.nombre}">
          <div class="card-body d-flex flex-column">
            <span class="badge text-bg-light border mb-2 align-self-start" th:text="${p.categoria.nombre}">Categoría</span>
            <h2 class="h6 card-title" th:text="${p.nombre}">Producto</h2>
            <p class="card-text text-body-secondary small mb-1" th:text="'Talla: ' + ${p.talla}">Talla: M</p>
            <p class="card-text text-body-secondary small mb-2" th:text="'Stock: ' + ${p.stock} + ' unidades'">Stock: 0 unidades</p>
            <p class="fw-bold mb-3" th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</p>
            <div class="mt-auto d-grid gap-2">
              <a th:href="@{/productos/{id}(id=${p.id})}" class="btn btn-outline-secondary btn-sm">Ver detalle</a>
              <button class="btn btn-outline-dark btn-sm" type="button" th:if="${p.stock > 0}">Agregar a venta</button>
              <button class="btn btn-outline-dark btn-sm" type="button" th:if="${p.stock == 0}" disabled>Sin stock</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
