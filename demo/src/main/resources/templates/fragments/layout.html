<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'StyleStore — ' + ${titulo}">StyleStore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <header th:fragment="header(activo)">
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid flex-column">
        <div class="row w-100 mb-2">
          <div class="col-12 col-md-6 col-lg-8 d-flex justify-content-center justify-content-md-start">
            <a class="navbar-brand fw-bold fs-2" th:href="@{/}">StyleStore</a>
          </div>
          <div class="col-12 col-md-6 col-lg-4 mt-2">
            <form class="d-flex" role="search" th:action="@{/productos}" method="get">
              <input class="form-control me-2" type="search" name="q" placeholder="Buscar" aria-label="Buscar productos">
              <button class="btn btn-brand" type="submit">Buscar</button>
            </form>
          </div>
          <hr class="mt-2 d-none d-md-block">
        </div>
        <div class="row w-100">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                  aria-controls="navMenu" aria-expanded="false" aria-label="Alternar navegación">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav m-auto mb-2 mb-lg-0 gap-lg-4">
              <li class="nav-item"><a class="nav-link" th:href="@{/}" th:classappend="${activo == 'inicio'} ? 'active'">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" th:href="@{/productos}" th:classappend="${activo == 'productos'} ? 'active'">Productos</a></li>
              <li class="nav-item"><a class="nav-link" th:href="@{/ventas}" th:classappend="${activo == 'ventas'} ? 'active'">Ventas</a></li>
              <li class="nav-item"><a class="nav-link" th:href="@{/admin/productos}" th:classappend="${activo == 'admin'} ? 'active'">Panel admin</a></li>
              <li class="nav-item"><a class="nav-link" th:href="@{/login}" th:classappend="${activo == 'login'} ? 'active'">Iniciar sesión</a></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
    <div class="container-fluid p-0"><div class="col brand-accent brand-strip"></div></div>
  </header>

  <footer th:fragment="footer" class="brand-accent text-black text-center py-4 mt-auto">
    <div class="container">
      <p class="mb-1 fw-semibold">StyleStore</p>
      <p class="mb-0 small">&copy; 2026 StyleStore.</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </footer>
</body>
</html>
