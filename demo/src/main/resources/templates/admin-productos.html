<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inventario')}"></head>
<body class="d-flex flex-column min-vh-100">
  <header th:replace="~{fragments/layout :: header('admin')}"></header>

  <main class="container my-4 flex-grow-1">
    <ul class="nav nav-pills mb-4">
      <li class="nav-item"><a class="nav-link active" th:href="@{/admin/productos}">Productos</a></li>
      <li class="nav-item"><a class="nav-link" th:href="@{/admin/categorias}">Categorías</a></li>
      <li class="nav-item"><a class="nav-link" th:href="@{/admin/usuarios}">Usuarios</a></li>
    </ul>

    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
      <span th:text="${mensaje}">Mensaje</span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h3 mb-1">Inventario</h1>
      </div>
      <a th:href="@{/admin/productos/nuevo}" class="btn btn-brand btn-sm">+ Nuevo producto</a>
    </div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th scope="col">ID</th><th scope="col">Nombre</th><th scope="col">Categoría</th>
            <th scope="col">Talla</th><th scope="col">Precio</th><th scope="col">Stock</th><th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${productos}" th:classappend="${p.stock == 0} ? 'table-warning'">
            <td th:text="${p.id}">1</td>
            <td><a th:href="@{/productos/{id}(id=${p.id})}" th:text="${p.nombre}">Nombre</a></td>
            <td th:text="${p.categoria.nombre}">Categoría</td>
            <td th:text="${p.talla}">M</td>
            <td th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td>
            <td th:text="${p.stock}">0</td>
            <td class="text-nowrap">
              <a th:href="@{/admin/productos/{id}/editar(id=${p.id})}" class="btn btn-sm btn-outline-secondary me-1">Editar</a>
              <form th:action="@{/admin/productos/{id}/eliminar(id=${p.id})}" method="post" class="d-inline"
                    onsubmit="return confirm('¿Eliminar este producto?');">
                <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(productos)}">
            <td colspan="7" class="text-center text-body-secondary">No hay productos registrados</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
