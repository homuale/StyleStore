<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle de venta')}"></head>
<body class="d-flex flex-column min-vh-100">
  <header th:replace="~{fragments/layout :: header('ventas')}"></header>

  <main class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Venta N.º <span th:text="${venta.id}">1</span></h1>
      <a th:href="@{/ventas}" class="btn btn-outline-secondary btn-sm">Volver al historial</a>
    </div>

    <dl class="row">
      <dt class="col-sm-3">Fecha</dt>
      <dd class="col-sm-9" th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy')}">01/09/2026</dd>
      <dt class="col-sm-3">Vendedor</dt>
      <dd class="col-sm-9" th:text="${venta.vendedor}">Vendedor</dd>
    </dl>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th scope="col">Producto</th><th scope="col" class="text-end">Precio unit.</th>
            <th scope="col" class="text-end">Cantidad</th><th scope="col" class="text-end">Subtotal</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="d : ${venta.detalles}">
            <td th:text="${d.producto.nombre}">Producto</td>
            <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(d.precioUnitario, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td>
            <td class="text-end" th:text="${d.cantidad}">1</td>
            <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(d.subtotal, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <th colspan="3" class="text-end">Total</th>
            <th class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(venta.total, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</th>
          </tr>
        </tfoot>
      </table>
    </div>

    <form th:action="@{/ventas/{id}/eliminar(id=${venta.id})}" method="post"
          onsubmit="return confirm('¿Eliminar esta venta? El stock se devolverá a los productos.');">
      <button class="btn btn-outline-danger" type="submit">Eliminar venta</button>
    </form>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
