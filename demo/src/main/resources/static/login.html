<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StyleStore — Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold fs-2" href="index.html">StyleStore</a>
            </div>
        </nav>
        <div class="container-fluid p-0">
            <div class="col brand-accent brand-strip"></div>
        </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-9 col-md-6 col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <h1 class="h4 mb-1">Iniciar sesión</h1>
                            <p class="text-body-secondary small mb-4">Accede con tu cuenta de StyleStore.</p>

                            <form novalidate>
                                <div class="mb-3">
                                    <label for="correo" class="form-label">Correo</label>
                                    <input type="email" class="form-control" id="correo" placeholder="nombre@correo.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="contrasena" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="contrasena" required>
                                </div>

                                <!-- Selector de rol: base de datos aun no implementada. -->
                                <div class="mb-4">
                                    <label class="form-label d-block">Rol (demo)</label>
                                    <div class="btn-group w-100" role="group" aria-label="Selección de rol">
                                        <input type="radio" class="btn-check" name="rol" id="rolVendedor" autocomplete="off" checked>
                                        <label class="btn btn-outline-dark" for="rolVendedor">Vendedor</label>

                                        <input type="radio" class="btn-check" name="rol" id="rolAdmin" autocomplete="off">
                                        <label class="btn btn-outline-dark" for="rolAdmin">Administrador</label>
                                    </div>
                                </div>

                                <div class="d-grid mb-3">
                                    <button type="submit" class="btn btn-brand">Ingresar</button>
                                </div>
                                <p class="text-center small mb-0">
                                    <a href="#" class="text-brand-accent text-decoration-none">¿Olvidaste tu contraseña?</a>
                                </p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="brand-accent text-black text-center py-4">
        <div class="container">
            <p class="mb-1 fw-semibold">StyleStore</p>
            <p class="mb-0 small">&copy; 2026 StyleStore.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>
</html>
